[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralnotes"
version = "0.1.0"
description = "A traceable, evaluated workspace for studying and researching technical documents."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
