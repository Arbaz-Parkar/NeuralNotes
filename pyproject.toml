[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralnotes"
version = "0.1.0"
description = "A traceable, evaluated workspace for studying and researching technical documents."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pypdf==6.21.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]
parser-eval = [
    "pdfplumber==0.11.10",
]
embeddings = [
    "sentence-transformers==6.2.0",
]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest]
minversion = "9.2"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=neuralnotes",
    "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["neuralnotes"]

[tool.coverage.report]
fail_under = 80
show_missing = true
