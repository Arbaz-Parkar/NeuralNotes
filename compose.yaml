services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuralnotes}
      POSTGRES_USER: ${POSTGRES_USER:-neuralnotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuralnotes-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - neuralnotes_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  neuralnotes_postgres_data:
